name: Continuous Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: continuous-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.414' # adjust to your SDK

      - name: Prepare publish folders
        run: |
          Remove-Item -Recurse -Force Publish, Pure3DDataViewer.zip -ErrorAction Ignore
          New-Item -ItemType Directory -Force Publish\Plugins | Out-Null

      - name: Inject commit hash into FrmMain.cs
        run: |
          $file = "Pure3DDataViewer/Pure3DDataViewer/FrmMain.cs"
          $commit = "${{ github.sha }}".Substring(0,7)
          
          $content = Get-Content $file -Raw
          
          $pattern = '\{Text\}\s+v\{version\}'
          $replacement = "{Text} v{version}-$commit"
          
          $newContent = [regex]::Replace($content, $pattern, $replacement)
          
          if ($content -eq $newContent) {
            Write-Host "Pattern did not match. Dumping nearby lines for debugging:"
            Get-Content $file | Select-String "_Text"
            exit 1
          } else {
            Write-Host "Commit hash injected: -$commit"
          }
          
          Set-Content $file $newContent

      - name: Publish main app
        run: |
          dotnet publish Pure3DDataViewer/Pure3DDataViewer/Pure3DDataViewer.csproj -c Release -r win-x64 -p:PublishSingleFile=true --self-contained false -o Pure3DDataViewer/Pure3DDataViewer/bin/publish
          Copy-Item Pure3DDataViewer/Pure3DDataViewer/bin/publish/Pure3DDataViewer.exe Publish/
          Copy-Item Pure3DDataViewer/Pure3DDataViewer/bin/publish/Pure3DDataViewerPluginAPI.dll Publish/

      - name: Publish plugins
        run: |
          $plugins = @(
            "ImportExportImages",
            "Sort",
            "Deduplicate",
            "LocationFromGame",
            "FrontendTextBibleEditor",
            "Validate",
            "CarPhysicsObjectGenerator",
            "TimeOfDayTint",
            "ConvertToLua",
            "CompositeDrawableEditor",
            "LocatorEditor"
          )

          foreach ($plugin in $plugins) {
            dotnet publish "Pure3DDataViewer/$plugin/$plugin.csproj" -c Release -r win-x64 --self-contained false -o "Pure3DDataViewer/$plugin/bin/publish"
            Copy-Item "Pure3DDataViewer/$plugin/bin/publish/$plugin.dll" "Publish/Plugins/"
          }

      - name: Create zip
        run: Compress-Archive -Path Publish\* -DestinationPath Pure3DDataViewer.zip -Force

      - name: Move continuous-build tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f continuous-build ${{ github.sha }}
          git push origin -f continuous-build

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous-build
          name: Continuous Build
          body: |
            Latest automatic build from branch **main**.
            Commit: ${{ github.sha }}
          draft: false
          prerelease: true
          files: Pure3DDataViewer.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}